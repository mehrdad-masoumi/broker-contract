syntax = "proto3";

package user.v1;

option go_package = "github.com/mehrdad-masoumi/broker-contract/gen/go/user/v1;userv1";

import "google/protobuf/timestamp.proto";

// ProjectionType mirrors monolith usercontract.ProjectionType.
enum ProjectionType {
  PROJECTION_TYPE_UNSPECIFIED = 0;
  PROJECTION_TYPE_BASIC = 1;
  PROJECTION_TYPE_WITH_PROFILE = 2;
  PROJECTION_TYPE_WITH_ROLES = 3;
  PROJECTION_TYPE_WITH_PROFILE_AND_ROLES = 4;
  PROJECTION_TYPE_FULL = 5;
}

message Profile {
  uint64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string avatar = 4;
  string father_name = 5;
  string national_id = 6;
  string nationality = 7;
  string country_code = 8;
  string birthdate = 9; // YYYY-MM-DD when set
  // Fields 14-17 support trading-account provisioning identity requirements
  // (e.g. meta.v1.TradingIdentity). Optional: empty until an owning identity
  // service (kyc-service) actually collects and syncs them; consumers must
  // tolerate empty values rather than treat them as authoritative KYC data.
  string city = 14;
  string state = 15;
  string zip_code = 16;
  string address_line = 17;
}

message Role {
  string id = 1;
  string description = 2;
  bool full_access = 3;
  bool admin_access = 4;
}

message Settings {
  uint64 user_id = 1;
  string language = 2;
  string timezone = 3;
  string currency = 4;
  bool notification_enabled = 5;
  bool trade_alerts_enabled = 6;
}

message TwoFactor {
  uint64 user_id = 1;
  bool enabled = 2;
}

message Hierarchy {
  uint64 user_id = 1;
  uint64 parent_id = 2;
  int32 level = 3;
  string path = 4;
  int32 subsets = 5;
}

// User is the cross-service user projection (equivalent to usercontract.Data).
message User {
  uint64 id = 1;
  string email = 2;
  string phone_number = 3;
  string status = 4; // active | inactive
  bool email_verify = 5;
  bool phone_verify = 6;
  Profile profile = 7;
  repeated Role roles = 8;
  Settings settings = 9;
  TwoFactor two_factor = 10;
  Hierarchy hierarchy = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message GetUserRequest {
  uint64 user_id = 1;
  ProjectionType projection = 2;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  repeated uint64 user_ids = 1;
  ProjectionType projection = 2;
}

message GetUsersResponse {
  map<uint64, User> users = 1;
}

message HasAdminAccessRequest {
  uint64 user_id = 1;
}

message HasAdminAccessResponse {
  bool has_admin_access = 1;
}

message HasFullAccessRequest {
  uint64 user_id = 1;
}

message HasFullAccessResponse {
  bool has_full_access = 1;
}

message GetRolesByUserIDRequest {
  uint64 user_id = 1;
}

message GetRolesByUserIDResponse {
  repeated Role roles = 1;
}

message GetPermissionKeysByUserIDRequest {
  uint64 user_id = 1;
}

message GetPermissionKeysByUserIDResponse {
  repeated string permission_keys = 1;
}

message GetUserIDsByRoleIDsRequest {
  repeated string role_ids = 1;
}

message GetUserIDsByRoleIDsResponse {
  repeated uint64 user_ids = 1;
}

message GetUserIDsByPermissionKeysRequest {
  repeated string permission_keys = 1;
}

message GetUserIDsByPermissionKeysResponse {
  repeated uint64 user_ids = 1;
}

message VerifyTwoFactorCodeRequest {
  uint64 user_id = 1;
  string code = 2;
}

message VerifyTwoFactorCodeResponse {
  bool valid = 1;
}

// ApplyKYCIdentityRequest is the minimal S2S payload from kyc-service after
// personal-info sync. Do not add national IDs, document images, or other KYC PII.
message ApplyKYCIdentityRequest {
  uint64 user_id = 1;
  string full_name = 2;
  string phone_number = 3;
  string nationality = 4;
  string country_code = 5;
  // Optional YYYY-MM-DD; empty means leave existing birthdate unchanged.
  string birthdate = 6;
}

message ApplyKYCIdentityResponse {
  bool applied = 1;
}

// StepUpPurpose identifies the business flow requesting second-factor verification.
// Wire string for RESET_TRADING_PASSWORD is "broker.reset_trading_password".
enum StepUpPurpose {
  STEP_UP_PURPOSE_UNSPECIFIED = 0;
  STEP_UP_PURPOSE_RESET_TRADING_PASSWORD = 1;
}

// StepUpMethod is how the client must satisfy the challenge.
enum StepUpMethod {
  STEP_UP_METHOD_UNSPECIFIED = 0;
  STEP_UP_METHOD_TOTP = 1;
  STEP_UP_METHOD_EMAIL_OTP = 2;
}

message BeginStepUpVerificationRequest {
  uint64 user_id = 1;
  StepUpPurpose purpose = 2;
}

message BeginStepUpVerificationResponse {
  string challenge_id = 1;
  StepUpMethod method = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message VerifyStepUpVerificationRequest {
  uint64 user_id = 1;
  string challenge_id = 2;
  StepUpPurpose purpose = 3;
  string code = 4;
}

message VerifyStepUpVerificationResponse {
  bool verified = 1;
}

// UserService is the sync S2S API for identity lookups and RBAC checks.
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc HasAdminAccess(HasAdminAccessRequest) returns (HasAdminAccessResponse);
  rpc HasFullAccess(HasFullAccessRequest) returns (HasFullAccessResponse);
  rpc GetRolesByUserID(GetRolesByUserIDRequest) returns (GetRolesByUserIDResponse);
  rpc GetPermissionKeysByUserID(GetPermissionKeysByUserIDRequest) returns (GetPermissionKeysByUserIDResponse);
  rpc GetUserIDsByRoleIDs(GetUserIDsByRoleIDsRequest) returns (GetUserIDsByRoleIDsResponse);
  rpc GetUserIDsByPermissionKeys(GetUserIDsByPermissionKeysRequest) returns (GetUserIDsByPermissionKeysResponse);
  rpc VerifyTwoFactorCode(VerifyTwoFactorCodeRequest) returns (VerifyTwoFactorCodeResponse);
  // ApplyKYCIdentity merges phone + profile fields from KYC into user-service SoT.
  rpc ApplyKYCIdentity(ApplyKYCIdentityRequest) returns (ApplyKYCIdentityResponse);
  // BeginStepUpVerification starts TOTP or email-OTP verification for a purpose
  // (e.g. broker trading-password reset). user-service owns OTP/TOTP + rate limits
  // and publishes notification.requested.v1 for email delivery.
  rpc BeginStepUpVerification(BeginStepUpVerificationRequest) returns (BeginStepUpVerificationResponse);
  rpc VerifyStepUpVerification(VerifyStepUpVerificationRequest) returns (VerifyStepUpVerificationResponse);
}
