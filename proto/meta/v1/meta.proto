syntax = "proto3";

package meta.v1;

option go_package = "github.com/mehrdad-masoumi/broker-contract/gen/go/meta/v1;metav1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// MetaService is the business-oriented internal S2S contract between
// broker-service (the caller) and a provider adapter service such as
// meta-service (the implementer). It expresses trading-platform operations
// as broker business concepts (CreateTradingAccount, Deposit, ListPositions,
// ...), never raw provider wire commands, retcodes, packet framing or
// authentication material. A provider adapter service translates every RPC
// here into whatever its underlying trading platform actually requires;
// broker-service must never depend on those details.
//
// Errors: implementations return standard gRPC status codes so callers never
// parse provider-specific error strings. INVALID_ARGUMENT (bad request),
// UNAUTHENTICATED (missing/invalid S2S credentials; do not retry without
// refreshing credentials),
// NOT_FOUND (unknown account/entity), ALREADY_EXISTS (duplicate/conflict),
// PERMISSION_DENIED (authorization/config failure at the provider),
// UNAVAILABLE (provider unreachable/timeout, safe to retry with backoff),
// DEADLINE_EXCEEDED (the caller's deadline elapsed; mutation outcome may be
// ambiguous, so reconcile before retrying any mutation),
// RESOURCE_EXHAUSTED (provider rate limit, retry with backoff),
// ABORTED (ambiguous mutation outcome — the caller must reconcile before
// ever retrying the same mutation, never blindly retry), UNIMPLEMENTED
// (capability intentionally not supported yet, e.g. trading execution),
// INTERNAL (unexpected provider failure).
//
// Trading execution (placing/modifying/canceling orders, closing positions)
// is intentionally out of this contract's first version. It is a distinct
// capability from reading trading data and must not be added by silently
// reusing these messages; see the originating task's execution-capability
// guidance before ever adding it.
service MetaService {
  rpc CreateTradingAccount(CreateTradingAccountRequest) returns (CreateTradingAccountResponse);
  rpc GetTradingAccount(GetTradingAccountRequest) returns (GetTradingAccountResponse);
  rpc ChangeTradingPassword(ChangeTradingPasswordRequest) returns (ChangeTradingPasswordResponse);
  rpc ChangeLeverage(ChangeLeverageRequest) returns (ChangeLeverageResponse);

  rpc Deposit(FundingRequest) returns (FundingResponse);
  rpc Withdraw(FundingRequest) returns (FundingResponse);

  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
  rpc ListActiveOrders(ListActiveOrdersRequest) returns (ListActiveOrdersResponse);
  rpc ListOrderHistory(ListOrderHistoryRequest) returns (ListOrderHistoryResponse);
  rpc ListDeals(ListDealsRequest) returns (ListDealsResponse);

  // ListGroups returns the provider's current account-group catalog. Groups are
  // identified by path/name (e.g. "real\\jettrade\\elite-usd"); MT5 does not
  // expose a separate stable group ID. available is true for every group
  // currently present in the live catalog — callers that persist a mapping
  // detect unavailability by absence from this list, never by deleting local data.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
}

enum TradingType {
  TRADING_TYPE_UNSPECIFIED = 0;
  TRADING_TYPE_DEMO = 1;
  TRADING_TYPE_LIVE = 2;
}

// TradingIdentity carries the minimum real-world identity fields a trading
// platform account requires. broker-service populates this from its
// authoritative identity source (user-service / kyc-service), never from
// unauthenticated frontend input. Optional fields may be empty when the
// owning identity service has not collected them yet; a provider adapter
// must tolerate empty optional fields rather than fail account creation.
message TradingIdentity {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string country_code = 5;
  string city = 6;
  string state = 7;
  string zip_code = 8;
  string address_line = 9;
}

// PasswordType distinguishes a trading account's main (trading) password
// from its read-only investor password.
enum PasswordType {
  PASSWORD_TYPE_UNSPECIFIED = 0;
  PASSWORD_TYPE_MAIN = 1;
  PASSWORD_TYPE_INVESTOR = 2;
}

message CreateTradingAccountRequest {
  // idempotency_reference is the broker-owned durable operation/reference id.
  // A provider adapter must use it to protect against duplicate provisioning
  // when a request is retried after an ambiguous outcome (network loss,
  // caller crash) — never rely on the caller not retrying. Like
  // FundingRequest, the underlying provider may have no native idempotency
  // key for account creation either; encode this value into whatever
  // provider-side field is queryable after the fact (e.g. a comment) and
  // check for an existing account before ever repeating provisioning.
  string idempotency_reference = 1;
  // external_group is the fully resolved provider-specific account group
  // (e.g. "real\\elite\\usd"), resolved server-side by broker-service from
  // its provider account profile mapping. broker-service never accepts this
  // value from an untrusted client.
  string external_group = 2;
  string currency = 3;
  int32 leverage = 4;
  TradingType trading_type = 5;
  TradingIdentity identity = 6;
  // main_password / investor_password are freshly, securely generated by
  // broker-service for this provisioning attempt. Never logged, never
  // persisted beyond the durable one-time-retrieval flow that produced them.
  // SENSITIVE: both services' gRPC interceptor chains (logging, tracing,
  // metrics) MUST redact these fields before this contract is considered
  // wired up; the contract's transport-level protection (TLS + S2S auth)
  // does not by itself prevent an interceptor from serializing them.
  string main_password = 7;
  string investor_password = 8;
}

message CreateTradingAccountResponse {
  string external_login = 1;
  string external_group = 2;
  google.protobuf.Timestamp created_at = 3;
  AccountSnapshot account = 4;
}

message GetTradingAccountRequest {
  string external_login = 1;
}

message GetTradingAccountResponse {
  AccountSnapshot account = 1;
}

message ChangeTradingPasswordRequest {
  string external_login = 1;
  PasswordType password_type = 2;
  // SENSITIVE: see CreateTradingAccountRequest.main_password — redact from
  // logs/tracing/metrics in both services.
  string new_password = 3;
}

message ChangeTradingPasswordResponse {
  bool changed = 1;
}

message ChangeLeverageRequest {
  string external_login = 1;
  int32 leverage = 2;
}

message ChangeLeverageResponse {
  AccountSnapshot account = 1;
}

// FundingRequest is shared by Deposit and Withdraw; the RPC name carries the
// direction so provider adapters never need a separate "type" field.
message FundingRequest {
  string external_login = 1;
  // amount MUST always be a positive decimal string. Direction is
  // determined solely by which RPC is called (Deposit vs Withdraw), never by
  // the sign of amount. Both broker-service and every provider adapter must
  // validate and reject amount <= 0 rather than rely on the other side.
  common.v1.Decimal amount = 2;
  // idempotency_reference is the broker-owned durable operation/reference id.
  // A provider adapter must encode it into the provider mutation in a way
  // that later reconciliation can match on (the underlying trading platform
  // may not offer a native idempotency key), and must never blindly repeat a
  // funding mutation whose prior outcome is unknown.
  string idempotency_reference = 3;
  string comment = 4;
}

message FundingResponse {
  // external_reference is the provider's own ticket/reference for this
  // mutation (e.g. an MT5 deal ticket), for audit and reconciliation.
  string external_reference = 1;
  common.v1.Decimal amount = 2;
  // account is the authoritative account state after the mutation was
  // applied at the provider. broker-service must treat this — not local
  // arithmetic — as the source of truth for the resulting balance.
  AccountSnapshot account = 3;
}

// AccountSnapshot is the authoritative provider account state. broker-service
// persists this as a local projection; it must never be treated as something
// broker-service can independently (re)compute.
message AccountSnapshot {
  string external_login = 1;
  string currency = 2;
  common.v1.Decimal balance = 3;
  common.v1.Decimal equity = 4;
  common.v1.Decimal margin = 5;
  common.v1.Decimal free_margin = 6;
  common.v1.Decimal margin_level = 7;
  common.v1.Decimal profit = 8;
  common.v1.Decimal credit = 9;
  int32 leverage = 10;
  google.protobuf.Timestamp captured_at = 11;
  // provider_metadata carries deliberate, wrapped provider-specific extras
  // that do not yet warrant a first-class contract field. Do not use this as
  // an escape hatch for raw provider protocol internals.
  map<string, string> provider_metadata = 12;
}

enum PositionAction {
  POSITION_ACTION_UNSPECIFIED = 0;
  POSITION_ACTION_BUY = 1;
  POSITION_ACTION_SELL = 2;
  // POSITION_ACTION_OTHER covers a provider value this contract version does
  // not yet model by name; see provider_raw_action for the original value.
  POSITION_ACTION_OTHER = 3;
}

message Position {
  string external_position_id = 1;
  string external_login = 2;
  string symbol = 3;
  PositionAction action = 4;
  string provider_raw_action = 5;
  common.v1.Decimal volume = 6;
  common.v1.Decimal open_price = 7;
  common.v1.Decimal current_price = 8;
  common.v1.Decimal stop_loss = 9;
  common.v1.Decimal take_profit = 10;
  common.v1.Decimal profit = 11;
  common.v1.Decimal swap = 12;
  string comment = 13;
  google.protobuf.Timestamp opened_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  map<string, string> provider_metadata = 16;
}

message ListPositionsRequest {
  string external_login = 1;
}

message ListPositionsResponse {
  // positions is the full authoritative set of currently open positions for
  // the account (a snapshot, not a delta). broker-service reconciles its
  // local projection against this full set — including detecting positions
  // that are open locally but absent here — rather than only upserting.
  repeated Position positions = 1;
  google.protobuf.Timestamp captured_at = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_BUY = 1;
  ORDER_TYPE_SELL = 2;
  ORDER_TYPE_BUY_LIMIT = 3;
  ORDER_TYPE_SELL_LIMIT = 4;
  ORDER_TYPE_BUY_STOP = 5;
  ORDER_TYPE_SELL_STOP = 6;
  ORDER_TYPE_OTHER = 7;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_PLACED = 1;
  ORDER_STATE_PARTIALLY_FILLED = 2;
  ORDER_STATE_FILLED = 3;
  ORDER_STATE_CANCELED = 4;
  ORDER_STATE_REJECTED = 5;
  ORDER_STATE_EXPIRED = 6;
  ORDER_STATE_OTHER = 7;
}

message Order {
  string external_order_id = 1;
  string external_login = 2;
  string symbol = 3;
  OrderType type = 4;
  string provider_raw_type = 5;
  OrderState state = 6;
  string provider_raw_state = 7;
  common.v1.Decimal price = 8;
  common.v1.Decimal trigger_price = 9;
  common.v1.Decimal stop_loss = 10;
  common.v1.Decimal take_profit = 11;
  common.v1.Decimal volume_initial = 12;
  common.v1.Decimal volume_current = 13;
  string comment = 14;
  google.protobuf.Timestamp setup_at = 15;
  google.protobuf.Timestamp expiration_at = 16;
  google.protobuf.Timestamp done_at = 17;
  map<string, string> provider_metadata = 18;
}

message ListActiveOrdersRequest {
  string external_login = 1;
}

message ListActiveOrdersResponse {
  // orders is the full authoritative set of currently active (non-terminal)
  // orders, a snapshot for the same reconciliation reason as ListPositions.
  repeated Order orders = 1;
  google.protobuf.Timestamp captured_at = 2;
}

message ListOrderHistoryRequest {
  string external_login = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 offset = 4;
  int32 limit = 5;
}

message ListOrderHistoryResponse {
  repeated Order orders = 1;
  bool has_more = 2;
}

enum DealAction {
  DEAL_ACTION_UNSPECIFIED = 0;
  DEAL_ACTION_BUY = 1;
  DEAL_ACTION_SELL = 2;
  DEAL_ACTION_BALANCE = 3;
  DEAL_ACTION_CREDIT = 4;
  DEAL_ACTION_OTHER = 5;
}

enum DealEntry {
  DEAL_ENTRY_UNSPECIFIED = 0;
  DEAL_ENTRY_IN = 1;
  DEAL_ENTRY_OUT = 2;
  DEAL_ENTRY_INOUT = 3;
  DEAL_ENTRY_OTHER = 4;
}

message Deal {
  string external_deal_id = 1;
  string external_order_id = 2;
  string external_position_id = 3;
  string external_login = 4;
  string symbol = 5;
  DealAction action = 6;
  string provider_raw_action = 7;
  DealEntry entry = 8;
  common.v1.Decimal volume = 9;
  common.v1.Decimal price = 10;
  common.v1.Decimal commission = 11;
  common.v1.Decimal swap = 12;
  common.v1.Decimal profit = 13;
  string reason = 14;
  string comment = 15;
  int64 magic = 16;
  google.protobuf.Timestamp executed_at = 17;
  map<string, string> provider_metadata = 18;
}

message ListDealsRequest {
  string external_login = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 offset = 4;
  int32 limit = 5;
}

message ListDealsResponse {
  repeated Deal deals = 1;
  bool has_more = 2;
}

message ListGroupsRequest {}

// TradingGroup is a provider account group entry suitable for admin selection.
// name is the canonical identifier (MT5 group path). Do not invent a synthetic
// id when the provider identifies groups by name.
message TradingGroup {
  string name = 1;
  bool available = 2;
}

message ListGroupsResponse {
  repeated TradingGroup groups = 1;
}
